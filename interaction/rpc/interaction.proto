syntax = "proto3";

package interaction;
option go_package = "./interaction";

service Interaction {
  rpc Like(LikeRequest) returns (CommonResp);
  rpc Favorite(FavoriteRequest) returns (CommonResp);
  rpc Follow(FollowRequest) returns (CommonResp);

  rpc GetMyFollowing(GetMyFollowingRequest) returns (GetMyFollowingResponse);
  rpc GetMyFavourites(GetMyFavouritesRequest) returns (GetMyFavouritesResponse);
  rpc GetPostFavoritesCount(GetPostFavoritesCountRequest) returns (GetPostFavoritesCountResponse);
}

message LikeRequest {
  int64 user_id = 1;
  int64 post_id = 2;
  bool like = 3;
}

message FavoriteRequest {
  int64 user_id = 1;
  int64 post_id = 2;
  bool favorite = 3;
}

message FollowRequest {
  int64 follower_id = 1;
  int64 following_id = 2;
  bool follow = 3;
}

message GetMyFollowingRequest {
  int64 user_id = 1;
  int64 page = 2;
  int64 page_size = 3;
}

message GetMyFollowingResponse {
  repeated UserId following = 1;
  int64 total = 2;
}

message GetMyFavouritesRequest {
  int64 user_id = 1;
  int64 page = 2;
  int64 page_size = 3;
}

message GetMyFavouritesResponse {
  repeated PostId favourites = 1;
  int64 total = 2;
}

message GetPostFavoritesCountRequest {
  int64 post_id = 1;
}

message GetPostFavoritesCountResponse {
  int64 total = 2;
}

message UserId {
  int64 id = 1;
}

message PostId {
  int64 id = 1;
}

message CommonResp {
  string message = 1;
}