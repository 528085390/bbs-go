syntax = "proto3";

package comment;

option go_package = "./comment";

// 评论服务
service CommentService {
  // 创建评论
  rpc CreateComment (CreateCommentReq) returns (CommentResp);

  // 获取帖子评论列表
  rpc ListComments (ListCommentsReq) returns (ListCommentsResp);

  // 删除评论
  rpc DeleteComment (DeleteCommentReq) returns (DeleteCommentResp);
}

// 创建评论请求
message CreateCommentReq {
  int64 post_id = 1;      // 帖子ID（来自路径参数）
  int64 author_id = 2;    // 作者ID
  int64 parent_id = 3;    // 父评论ID，0表示顶级评论
  string content = 4;     // 评论内容
}

// 评论响应
message CommentResp {
  int64 id = 1;
  int64 post_id = 2;
  int64 author_id = 3;
  int64 parent_id = 4;
  string content = 5;
  uint32 depth = 6;
  string created_at = 8;
  string updated_at = 9;
}

// 获取评论列表请求
message ListCommentsReq {
  int64 post_id = 1;      // 帖子ID（来自路径参数）
}

// 获取评论列表响应
message ListCommentsResp {
  repeated CommentResp comments = 1;
  uint64 total = 2;
}

// 删除评论请求
message DeleteCommentReq {
  int64 id = 1;           // 评论ID
}

// 删除评论响应
message DeleteCommentResp {
  bool success = 1;
}
