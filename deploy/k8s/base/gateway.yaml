apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: temp
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: temp-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
        envFrom:
        - configMapRef:
            name: bbs-config
        readinessProbe:
          tcpSocket:
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8888
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: temp
spec:
  ports:
  - port: 8888
    targetPort: 8888
  selector:
    app: gateway
