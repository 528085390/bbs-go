apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: temp
  labels:
    app: etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.15
        ports:
        - containerPort: 2379
        - containerPort: 2380
        env:
        - name: ETCD_NAME
          value: bbs-etcd
        - name: ETCD_DATA_DIR
          value: /etcd-data
        - name: ETCD_ADVERTISE_CLIENT_URLS
          value: http://etcd-svc:2379
        - name: ETCD_LISTEN_CLIENT_URLS
          value: http://0.0.0.0:2379
        - name: ETCD_LISTEN_PEER_URLS
          value: http://0.0.0.0:2380
        - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
          value: http://etcd-svc:2380
        - name: ETCD_INITIAL_CLUSTER
          value: bbs-etcd=http://etcd-svc:2380
        - name: ETCD_INITIAL_CLUSTER_STATE
          value: new
        readinessProbe:
          exec:
            command:
            - etcdctl
            - endpoint
            - health
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - etcdctl
            - endpoint
            - health
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /etcd-data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: etcd-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-svc
  namespace: temp
spec:
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  - name: peer
    port: 2380
    targetPort: 2380
  selector:
    app: etcd
