name: Mirror ArgoCD Images

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull, tag and push to ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NS: ${{ secrets.ACR_NAMESPACE }}
        run: |
          REG=$(echo "$ACR_REGISTRY" | tr -d '[:space:]')
          NS=$(echo "$ACR_NS" | tr -d '[:space:]')

          docker pull quay.io/argoproj/argocd:v2.10.8
          docker tag quay.io/argoproj/argocd:v2.10.8 $REG/$NS/argocd:v2.10.8
          docker push $REG/$NS/argocd:v2.10.8

          docker pull redis:7.0.14-alpine
          docker tag redis:7.0.14-alpine $REG/$NS/argocd-redis:7.0.14-alpine
          docker push $REG/$NS/argocd-redis:7.0.14-alpine
