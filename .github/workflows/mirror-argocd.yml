name: Mirror ArgoCD Images

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Copy ArgoCD images to Aliyun ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NS: ${{ secrets.ACR_NAMESPACE }}
          ACR_USER: ${{ secrets.ACR_USERNAME }}
          ACR_PASS: ${{ secrets.ACR_PASSWORD }}
        run: |
          DST="docker://$ACR_REGISTRY/$ACR_NS"
          AUTH="--dest-creds=$ACR_USER:$ACR_PASS"

          echo "=== argocd core ==="
          skopeo copy $AUTH \
            "docker://quay.io/argoproj/argocd:v2.10.8" \
            "$DST/argocd:v2.10.8"

          echo "=== redis ==="
          skopeo copy $AUTH \
            "docker://docker.io/library/redis:7.0.14-alpine" \
            "$DST/argocd-redis:7.0.14-alpine"
