name: Mirror ArgoCD Images

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag ArgoCD images
        run: |
          REGISTRY="ghcr.io/${{ github.repository }}"
          VERSION=v2.10.8
          REDIS_VER=7.0.14-alpine

          mirror() {
            local src=$1 tag=$2 name=$3
            echo "=== $src:$tag -> $REGISTRY/argocd-$name:$tag ==="
            docker pull "$src:$tag"
            docker tag "$src:$tag" "$REGISTRY/argocd-$name:$tag"
            docker push "$REGISTRY/argocd-$name:$tag"
          }

          mirror quay.io/argoproj/argocd                $VERSION core
          mirror quay.io/argoproj/argocd-dex             $VERSION dex
          mirror quay.io/argoproj/argocd-notifications   $VERSION notifications
          mirror quay.io/argoproj/argocd-applicationset  $VERSION applicationset
          mirror redis                                    $REDIS_VER redis
