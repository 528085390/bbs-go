name: Mirror ArgoCD Images

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag
        run: |
          REGISTRY="ghcr.io/${{ github.repository }}"

          docker pull quay.io/argoproj/argocd:v2.10.8
          docker pull quay.io/argoproj/argocd-dex:v2.10.8
          docker pull quay.io/argoproj/argocd-notifications:v2.10.8
          docker pull quay.io/argoproj/argocd-applicationset:v2.10.8
          docker pull redis:7.0.14-alpine

          docker tag quay.io/argoproj/argocd:v2.10.8              $REGISTRY/argocd:core-v2.10.8
          docker tag quay.io/argoproj/argocd-dex:v2.10.8          $REGISTRY/argocd:dex-v2.10.8
          docker tag quay.io/argoproj/argocd-notifications:v2.10.8 $REGISTRY/argocd:notifications-v2.10.8
          docker tag quay.io/argoproj/argocd-applicationset:v2.10.8 $REGISTRY/argocd:applicationset-v2.10.8
          docker tag redis:7.0.14-alpine                          $REGISTRY/argocd:redis-7.0.14-alpine

          # 一次推送所有标签
          docker push $REGISTRY/argocd --all-tags
