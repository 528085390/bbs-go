name: Mirror ArgoCD Images

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Copy images to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DST="docker://ghcr.io/${{ github.repository }}"
          AUTH="--dest-creds=${{ github.actor }}:$GHCR_TOKEN"

          # 核心镜像（已成功）
          echo "=== argocd core ==="
          skopeo copy $AUTH \
            "docker://quay.io/argoproj/argocd:v2.10.8" \
            "$DST/argocd:core-v2.10.8"

          # redis（从 Docker Hub）
          echo "=== redis ==="
          skopeo copy $AUTH \
            "docker://docker.io/library/redis:7.0.14-alpine" \
            "$DST/argocd-redis:7.0.14-alpine"
