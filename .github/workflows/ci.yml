name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        service:
          - auth
          - user
          - section
          - post
          - comment
          - interaction
          - search
          - file
          - gateway
        include:
          - service: auth
            dockerfile: auth/Dockerfile
          - service: user
            dockerfile: user/Dockerfile
          - service: section
            dockerfile: section/rpc/Dockerfile
          - service: post
            dockerfile: post/rpc/Dockerfile
          - service: comment
            dockerfile: comment/rpc/Dockerfile
          - service: interaction
            dockerfile: interaction/rpc/Dockerfile
          - service: search
            dockerfile: search/rpc/Dockerfile
          - service: file
            dockerfile: file/rpc/Dockerfile
          - service: gateway
            dockerfile: gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest

  update-config:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update Kustomize image tags
        working-directory: deploy/k8s/overlays/dev
        run: |
          for service in auth user section post comment interaction search file gateway; do
            kustomize edit set image temp-${service}=ghcr.io/${{ github.repository }}/${service}:sha-${{ github.sha }}
          done

      - name: Commit and push config update
        run: |
          git config user.name "CI Bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add deploy/k8s/overlays/dev/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update image tags to sha-${{ github.sha }} [skip ci]"
            git push
          fi
