Name: gateway
Host: 0.0.0.0
Port: 8888

JwtSecret: this is a secret

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: gateway

# 上游服务配置
Upstreams:
  # User RPC 服务
  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: user.rpc
      # 如果本地开发没有 etcd，使用直接连接
      # Target: localhost:8080
    Mappings:
      # GET /api/user/ping -> user.User/Ping
      - Method: get
        Path: /api/user/ping
        RpcPath: user.User/Ping
      
      # POST /api/user/info -> user.User/GetUserInfoBy
      - Method: post
        Path: /api/user/id
        RpcPath: user.User/GetUserInfoBy
      
      # PUT /api/user/info -> user.User/UpdateUserInfo
      - Method: put
        Path: /api/user/id
        RpcPath: user.User/UpdateUserInfo


  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: section.rpc
    Mappings:
      - Method: post
        Path: /api/sections
        RpcPath: section.SectionService/CreateSection

      - Method: put
        Path: /api/sections/:id
        RpcPath: section.SectionService/UpdateSection

      - Method: delete
        Path: /api/sections/:id
        RpcPath: section.SectionService/DeleteSection

