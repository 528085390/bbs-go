Name: gateway
Host: 0.0.0.0
Port: 8888

JwtSecret: this is a secret

PublicRoutes:
  # Auth
  - Method: post
    Path: /api/auth/login
  - Method: post
    Path: /api/auth/register
  - Method: get
    Path: /api/health

  # Section
  - Method: get
    Path: /api/sections
  - Method: get
    Path: /api/sections/:id

  # Post
  - Method: get
    Path: /api/posts
  - Method: get
    Path: /api/posts/:id
  - Method: get
    Path: /api/posts/:postId/favorites/count
  - Method: get
    Path: /api/posts/:postId/images

  # Comment
  - Method: get
    Path: /api/posts/:postId/comments
  - Method: get
    Path: /api/posts/:postId/comments/count

  # Search
  - Method: get
    Path: /api/posts/search

  # File
  - Method: get
    Path: /api/files/:id
  - Method: get
    Path: /api/users/:userId/avatar

Upstreams:
  # User RPC 服务
  - Grpc:
      #       生产/联调用：etcd 服务发现
      Etcd:
        Hosts:
          - localhost:2379
        Key: user.rpc
      # 本地直连（启用时请注释掉上面的 Etcd）
    #       Target: localhost:8004
    Mappings:
      - Method: get
        Path: /api/health
        RpcPath: user.User/Ping

      - Method: get
        Path: /api/users/:id
        RpcPath: user.User/GetUserInfoBy

      - Method: put
        Path: /api/users/:id
        RpcPath: user.User/UpdateUserInfo

  # Auth RPC 服务
  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: auth.rpc
    Mappings:
      - Method: post
        Path: /api/auth/login
        RpcPath: auth.Auth/Login

      - Method: post
        Path: /api/auth/register
        RpcPath: auth.Auth/Register

  # Section RPC 服务
  - Grpc:
      # 生产/联调用：etcd 服务发现
      Etcd:
        Hosts:
          - localhost:2379
        Key: section.rpc
      # 本地直连（启用时请注释掉上面的 Etcd）
      # Target: localhost:8081
    Mappings:
      - Method: post
        Path: /api/sections
        RpcPath: section.SectionService/CreateSection

      - Method: get
        Path: /api/sections
        RpcPath: section.SectionService/ListSections

      - Method: get
        Path: /api/sections/:id
        RpcPath: section.SectionService/GetSection

      - Method: put
        Path: /api/sections/:id
        RpcPath: section.SectionService/UpdateSection

      - Method: delete
        Path: /api/sections/:id
        RpcPath: section.SectionService/DeleteSection

  # Post RPC 服务
  - Grpc:
      # 生产/联调用：etcd 服务发现
      Etcd:
        Hosts:
          - localhost:2379
        Key: post.rpc
      # 本地直连（启用时请注释掉上面的 Etcd）
    #       Target: localhost:8005
    Mappings:
      - Method: post
        Path: /api/posts
        RpcPath: post.PostService/CreatePost

      - Method: get
        Path: /api/posts/:id
        RpcPath: post.PostService/GetPost

      - Method: put
        Path: /api/posts/:id
        RpcPath: post.PostService/UpdatePost

      - Method: delete
        Path: /api/posts/:id
        RpcPath: post.PostService/DeletePost

      - Method: patch
        Path: /api/posts/:id/pin
        RpcPath: post.PostService/PinPost

      - Method: patch
        Path: /api/posts/:id/feature
        RpcPath: post.PostService/FeaturePost

  # Comment RPC 服务
  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: comment.rpc
      # Target: localhost:8006
    Mappings:
      - Method: post
        Path: /api/posts/:postId/comments
        RpcPath: comment.CommentService/CreateComment

      - Method: get
        Path: /api/posts/:postId/comments
        RpcPath: comment.CommentService/ListComments

      - Method: get
        Path: /api/posts/:postId/comments/count
        RpcPath: comment.CommentService/GetCommentCount

      - Method: delete
        Path: /api/posts/:postId/comments/:id
        RpcPath: comment.CommentService/DeleteComment


  # Interaction RPC 服务
  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: interaction.rpc
      # Target: localhost:8007
    Mappings:
      - Method: post
        Path: /api/posts/:postId/likes
        RpcPath: interaction.Interaction/Like

      - Method: post
        Path: /api/posts/:postId/favorites
        RpcPath: interaction.Interaction/Favorite

      - Method: post
        Path: /api/users/:userId/following
        RpcPath: interaction.Interaction/Follow

      - Method: get
        Path: /api/users/:userId/following
        RpcPath: interaction.Interaction/GetMyFollowing

      - Method: get
        Path: /api/users/:userId/favorites
        RpcPath: interaction.Interaction/GetMyFavourites

      - Method: get
        Path: /api/posts/:postId/favorites/count
        RpcPath: interaction.Interaction/GetPostFavoritesCount

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: search.rpc
    Mappings:
      - Method: get
        Path: /api/posts/search
        RpcPath: search.SearchService/Search

  # File RPC 服务
  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: file.rpc
    Mappings:
      # 生成上传凭证（需要鉴权）
      - Method: post
        Path: /api/files/uploads
        RpcPath: file.FileService/GetUploadURL

      # 确认上传完成（需要鉴权）
      - Method: post
        Path: /api/files
        RpcPath: file.FileService/ConfirmUpload

      # 获取文件信息（公开访问）
      - Method: get
        Path: /api/files/:id
        RpcPath: file.FileService/GetFile

      # 头像上传
      - Method: post
        Path: /api/users/:userId/avatar/uploads
        RpcPath: file.FileService/GetAvatarUploadURL

      - Method: post
        Path: /api/users/:userId/avatar
        RpcPath: file.FileService/ConfirmAvatarUpload

      - Method: get
        Path: /api/users/:userId/avatar
        RpcPath: file.FileService/GetAvatar

      # 帖子图片上传
      - Method: post
        Path: /api/posts/:postId/images/uploads
        RpcPath: file.FileService/GetPostImageUploadURL

      - Method: post
        Path: /api/posts/:postId/images
        RpcPath: file.FileService/ConfirmPostImageUpload

      - Method: get
        Path: /api/posts/:postId/images
        RpcPath: file.FileService/GetPostImages
