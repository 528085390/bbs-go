syntax = "proto3";

package post;
option go_package = "./post";

service PostService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc PinPost(PinPostRequest) returns (PinPostResponse);
  rpc FeaturePost(FeaturePostRequest) returns (FeaturePostResponse);
  rpc ExistsPost(ExistsPostRequest) returns (ExistsPostResponse);
  rpc GetPostMeta(GetPostMetaRequest) returns (GetPostMetaResponse);
}

message PostRequest {
  int64 author_id = 1;
  int64 section_id = 2;
  string title = 3;
  string content = 4;
}

message Post {
  int64 id = 1;
  int64 author_id = 2;
  int64 section_id = 3;
  string title = 4;
  string content = 5;
  int64 view_count = 6;
  bool pinned = 7;
  bool featured = 8;
  string created_at = 9;
  string updated_at = 10;
}

message PostMeta {
  int64 id = 1;
  int64 author_id = 2;
  int64 section_id = 3;
  string title = 4;
}

message CreatePostRequest {
  PostRequest post = 1;
}

message CreatePostResponse {
  Post post = 1;
}

message GetPostRequest {
  int64 id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message UpdatePostRequest {
  int64 id = 1;
  PostRequest post = 2;
}

message UpdatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  int64 id = 1;
}

message DeletePostResponse {
  bool success = 1;
  string message = 2;
}

message PinPostRequest {
  int64 id = 1;
  bool value = 2;
}

message PinPostResponse {
  bool success = 1;
  string message = 2;
}

message FeaturePostRequest {
  int64 id = 1;
  bool value = 2;
}

message FeaturePostResponse {
  bool success = 1;
  string message = 2;
}

message ExistsPostRequest {
  int64 id = 1;
}

message ExistsPostResponse {
  bool exists = 1;
}

message GetPostMetaRequest {
  int64 id = 1;
}

message GetPostMetaResponse {
  PostMeta meta = 1;
}

// goctl rpc protoc post.proto --go_out=. --go-grpc_out=. --zrpc_out=.

