syntax = "proto3";

package post;
option go_package = "./post";
import "common/proto/common.proto";

service PostService {
  rpc CreatePost(PostRequest) returns (PostResp);
  rpc GetPost(IdPathReq) returns (PostResp);
  rpc UpdatePost(UpdatePostReq) returns (PostResp);
  rpc DeletePost(IdPathReq) returns (CommonResp);
  rpc PinPost(ToggleReq) returns (CommonResp);
  rpc FeaturePost(ToggleReq) returns (CommonResp);
  rpc ExistsPost(IdPathReq) returns (ExistsResp);
  rpc MetaPost(IdPathReq) returns (PostMetaResp);
  rpc Search(common.SearchRequest) returns (common.SearchResponse);
}

message PostRequest {
  int64 author_id = 1;
  uint64 section_id = 2;
  string title = 3;
  string content = 4;
}

message PostResp {
  int64 id = 1;
  int64 author_id = 2;
  uint64 section_id = 3;
  string title = 4;
  string content = 5;
  int64 view_count = 6;
  bool pinned = 7;
  bool featured = 8;
  string created_at = 9;
  string updated_at = 10;
}

message PostMetaResp {
  int64 id = 1;
  int64 author_id = 2;
  uint64 section_id = 3;
  string title = 4;
}

message IdPathReq {
  int64 id = 1;
}

message UpdatePostReq {
  int64 id = 1;
  int64 author_id = 2;
  uint64 section_id = 3;
  string title = 4;
  string content = 5;
}

message ToggleReq {
  int64 id = 1;
  bool value = 2;
}

message ExistsResp {
  bool data = 1;
}

message CommonResp {
  string message = 1;
}


// goctl rpc protoc post.proto --go_out=. --go-grpc_out=. --zrpc_out=.
